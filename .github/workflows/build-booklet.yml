name: Build ModEL booklet PDF for owner review
on:
  workflow_dispatch:
  push:
    paths:
      - data/edition.json
      - scripts/build-private-booklet.mjs
      - assets/private-booklet.css
      - package.json
      - .github/workflows/build-booklet.yml
permissions:
  contents: read
jobs:
  booklet:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install document renderer
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium and fonts
        run: npx playwright install --with-deps chromium
      - name: Compile and verify the complete A4 portrait booklet
        run: npm run build:booklet:private
      - name: Preserve one-day owner review copy without deploying it
        uses: actions/upload-artifact@v4
        with:
          name: sikum10-modell-portrait-review
          path: |
            .private-output/booklet_modell_sikum10_private.pdf
            .private-output/report.json
          retention-days: 1
          if-no-files-found: error
