name: Browser QA - Summary 10
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile, desktop, source and safety QA
        run: npm run test:ui
      - name: Save screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sikum10-browser-qa
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
