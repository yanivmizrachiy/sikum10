name: Verify Summary 10
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application and private-booklet generator syntax
        run: |
          node --check assets/app.js
          node --check scripts/build-private-booklet.mjs
      - name: Check source data and rendering contract
        run: node --test tests/verify.mjs
      - name: Verify absence of distributed capture media
        run: |
          if find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.pdf' \) -not -path './.git/*' -not -path './assets/district-logo.png' | grep . ; then
            echo "Unapproved media files found in summary repository"
            exit 1
          fi
          echo "Only the approved district seal is in the repository; no source photographs or PDFs"
