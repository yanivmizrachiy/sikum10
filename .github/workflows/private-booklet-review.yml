name: Private portrait ModEL booklet review
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-booklet-review.yml"
      - "scripts/generate-private-booklet.mjs"
      - "scripts/private-review-public.pem"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Read-only checkout of summary 10
        uses: actions/checkout@v4
      - name: Read-only pinned source of 43 original photographs
        uses: actions/checkout@v4
        with:
          repository: yanivmizrachiy/yaniv-raz-math-presentation
          ref: 763df45eb6b82e0986832562b3335aedb6ddde17
          path: source
          persist-credentials: false
          sparse-checkout: |
            public/content
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install booklet rendering dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate complete A4 portrait PDF privately
        run: node scripts/generate-private-booklet.mjs
      - name: Encrypt the review copy before uploading anything
        run: |
          set -euo pipefail
          openssl rand -hex 32 > review/passkey.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in review/sikum10-model-booklet.pdf \
            -out review/sikum10-model-booklet.pdf.enc \
            -pass file:review/passkey.txt
          openssl pkeyutl -encrypt -pubin \
            -inkey scripts/private-review-public.pem \
            -in review/passkey.txt -out review/passkey.txt.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          test -s review/sikum10-model-booklet.pdf.enc
          test -s review/passkey.txt.enc
          rm -f review/sikum10-model-booklet.pdf review/passkey.txt review/booklet.html
      - name: Upload only encrypted, short-lived review files
        uses: actions/upload-artifact@v4
        with:
          name: sikum10-encrypted-booklet-review
          path: |
            review/sikum10-model-booklet.pdf.enc
            review/passkey.txt.enc
          if-no-files-found: error
          retention-days: 1
